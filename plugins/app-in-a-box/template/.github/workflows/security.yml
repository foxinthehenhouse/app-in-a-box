# Security gate.
#   gitleaks  secrets in the tree AND in the commits a PR adds (config: .gitleaks.toml).
#             Replaces the old regex scan. The pre-commit hook is the fast local layer;
#             this catches what bypassed it (another machine, --no-verify, the web UI).
#   codeql    static analysis for Python and JS/TS. Free on PUBLIC repos. On a private
#             repo it needs GitHub Advanced Security (Code Security), a paid add-on,
#             so it runs only when the repo is public or `vars.ENABLE_CODEQL == 'true'`.
#             ⚖️ Owner's call whether a private repo pays for it; see the harness skill.
# Dependency updates: .github/dependabot.yml (pip, npm, github-actions; weekly, grouped).
name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs share a per-PR group (a newer push cancels the stale run). Every other run
  # (push to main, schedule, manual) gets its OWN group: under a shared `github.ref`
  # key GitHub keeps one PENDING run per group and silently cancels older ones, so a
  # burst of merges left main's middle commits unchecked in the app this kit came from.
  group: security-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download gitleaks (checksum-verified)
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: No env files tracked
        run: |
          if git ls-files | grep -P '(^|/)\.env(\.(?!example$)[^/]+)?$'; then
            echo "::error::an .env file is tracked; remove it and rotate every value in it"; exit 1
          fi
      - name: Secrets in the working tree
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
      - name: Secrets in this PR's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="${BASE_SHA}..HEAD"

  codeql:
    if: ${{ !github.event.repository.private || vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
