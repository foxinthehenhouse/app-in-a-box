# Security gate.
#   gitleaks  secrets in the tree AND in the commits a PR adds (config: .gitleaks.toml).
#             Replaces the old regex scan. The pre-commit hook is the fast local layer;
#             this catches what bypassed it (another machine, --no-verify, the web UI).
#   codeql    static analysis for Python and JS/TS. Free on PUBLIC repos. On a private
#             repo it needs GitHub Advanced Security (Code Security), a paid add-on,
#             so it runs only when the repo is public or `vars.ENABLE_CODEQL == 'true'`.
#             ⚖️ Owner's call whether a private repo pays for it; see the harness skill.
#   dependencies  known vulnerabilities in what we install, and an SBOM of it:
#             pip-audit over requirements-dev.lock (every locked Python package);
#             npm audit over mobile/ (high + critical, production deps; triaged entries
#             live in mobile/npm-audit-allowlist.json, see scripts/check_npm_audit.py);
#             CycloneDX SBOMs of requirements.lock and mobile/package-lock.json,
#             uploaded as the `sbom` artifact. The weekly schedule catches advisories
#             published against code nobody touched.
# Dependency updates: .github/dependabot.yml (pip, npm, github-actions; weekly, grouped,
# after a cooldown).
name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs share a per-PR group (a newer push cancels the stale run). Every other run
  # (push to main, schedule, manual) gets its OWN group: under a shared `github.ref`
  # key GitHub keeps one PENDING run per group and silently cancels older ones, so a
  # burst of merges left main's middle commits unchecked in the app this kit came from.
  group: security-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download gitleaks (checksum-verified)
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: No env files tracked
        run: |
          if git ls-files | grep -P '(^|/)\.env(\.(?!example$)[^/]+)?$'; then
            echo "::error::an .env file is tracked; remove it and rotate every value in it"; exit 1
          fi
      - name: Secrets in the working tree
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
      - name: Secrets in this PR's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="${BASE_SHA}..HEAD"

  codeql:
    if: ${{ !github.event.repository.private || vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYFT_VERSION: "1.54.0"
      SYFT_SHA256: 54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install pip-audit and cyclonedx-py (hashed, from the dev lock)
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Python SBOM (CycloneDX, from requirements.lock, what ships)
        run: |
          mkdir -p sbom
          cyclonedx-py requirements requirements.lock --of JSON -o sbom/python.cdx.json
      - name: Mobile app scaffolded?
        id: app
        run: |
          if [ -f mobile/package-lock.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::notice::mobile/package-lock.json not found (scaffold phase not run yet); skipping npm audit and the mobile SBOM"
          echo "present=false" >> "$GITHUB_OUTPUT"
      - name: Download syft (checksum-verified)
        if: steps.app.outputs.present == 'true'
        run: |
          curl -fsSL -o syft.tgz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tgz" | sha256sum -c -
          tar -xzf syft.tgz syft
      - name: Mobile SBOM (CycloneDX, from mobile/package-lock.json)
        if: steps.app.outputs.present == 'true'
        run: ./syft scan dir:mobile --exclude ./node_modules -o cyclonedx-json=sbom/mobile.cdx.json -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 90
      - name: pip-audit (known vulnerabilities in the locked Python deps)
        # A finding with no fix yet: add `--ignore-vuln <ID>` here with a comment saying
        # why it is safe to ship, and take it out when the fix lands.
        run: pip-audit --disable-pip --require-hashes -r requirements-dev.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !cancelled() && steps.app.outputs.present == 'true' }}
        with:
          node-version: 22
      - name: npm audit (high + critical, production deps, minus triaged advisories)
        # Runs even when pip-audit failed, so one red run lists everything to fix.
        if: ${{ !cancelled() && steps.app.outputs.present == 'true' }}
        run: python3 scripts/check_npm_audit.py
