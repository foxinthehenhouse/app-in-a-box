# CI: the merge gate. Required checks for branch protection: `python`, `mobile`.
#   python: ruff + pyright + lint-imports (architecture boundaries) + pytest with a
#           coverage floor. pytest collects tests/ AND tests/harness/ (skills, agents,
#           rules, memory, hooks, AGENTS.md, workflows, JSON/TOML configs), so the
#           agent harness is linted on every PR too.
#   mobile: `npm run gates` (tsc + eslint + guard scripts + jest).
# Sibling workflows: workflow-lint.yml, security.yml, db.yml.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Nightly: some breakage is TIME-based, not commit-based (a runner image update, a
  # tool that changed under an action); only a clock catches that.
  # Python deps no longer float here: CI installs the hashed requirements-dev.lock.
  schedule:
    - cron: "14 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs share a per-PR group (a newer push cancels the stale run). Every other run
  # (push to main, schedule, manual) gets its OWN group: under a shared `github.ref`
  # key GitHub keeps one PENDING run per group and silently cancels older ones, so a
  # burst of merges left main's middle commits unchecked in the app this kit came from.
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Lock files match requirements*.txt
        # requirements*.txt are the ranges; the .lock files are what installs. Edited a
        # range without rerunning scripts/lock-deps.sh? This fails and says so.
        run: python3 scripts/check_lock.py
      - name: Install (exact versions, every hash checked)
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Design tokens clear WCAG AA (design/tokens.json)
        # The same gate the kit ran at scaffold time, re-run on every change: a palette
        # edit after scaffold is how sub-AA text ships with green CI.
        run: python3 scripts/check_contrast.py design/tokens.json
      - name: Design tokens avoid the generic tells (design/tokens.json)
        # Overused fonts, pure-grey neutrals, the stock AI violet, overshooting curves:
        # docs/design/TASTE.md. The kit ran the same check on every prototype direction.
        run: python3 scripts/check_design.py design/tokens.json
      - name: DESIGN.md matches design/tokens.json
        # DESIGN.md is what agents read before UI work. Its generated blocks are a
        # projection of tokens.json: a hand edit there, or a token change nobody
        # regenerated, would tell every later session the wrong design.
        run: python3 scripts/design_md.py --check
      - name: Guardrail packs (privacy/data-map.yaml → packs; docs/privacy/GUARDRAILS.md)
        # No personal data in analytics payloads or log calls, plus whatever each enabled
        # pack enforces (location, minors, health, ugc, financial, biometric).
        run: python3 scripts/check_guardrails.py
      - name: Feature flags have an owner and an expiry (mobile/lib/flags.ts, backend/flags.py)
        # A flag nobody owns, with no date to remove it, lives forever. Expired flags only
        # warn here (a passing date is not a code change); the `next` skill surfaces them.
        run: python3 scripts/check_flags.py
      - name: Ruff
        run: ruff check backend tests scripts
      - name: Pyright (basic mode, config in pyproject.toml)
        run: pyright
      - name: Architecture boundaries (import-linter, contracts in pyproject.toml)
        # Routers -> services -> db/config, never upward; LLM SDKs only in the AI fence.
        run: lint-imports
      - name: Pytest (backend + harness lint) with coverage floor
        run: python -m pytest -q --cov --cov-report=term-missing

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip until the mobile app is scaffolded
        id: app
        # `mobile` is a REQUIRED check, so it must not be green by skipping once the app
        # exists. Before the scaffold phase there is nothing to gate; after it (appbox.yaml
        # says progress.scaffold: done) a missing package.json is a broken repo, not a
        # pre-scaffold one, and the job fails.
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if grep -Eq '^[[:space:]]+scaffold:[[:space:]]*done' ../appbox.yaml 2>/dev/null; then
            echo "::error::appbox.yaml says the scaffold is done but mobile/package.json is missing"; exit 1
          fi
          echo "::notice::mobile/package.json not found (scaffold phase not run yet); skipping gates"
          echo "present=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        if: steps.app.outputs.present == 'true'
        # --ignore-scripts: no package's install script runs on the runner. The gates
        # (tsc, eslint, jest) need none: the only scripts in the Expo tree fetch native
        # binaries (sentry-cli, a resolver's prebuilt binding, macOS fsevents) that npm
        # already installs as optional packages. EAS builds run their own install.
        run: npm ci --ignore-scripts
      - name: Gates (tsc + eslint + guard scripts + jest)
        if: steps.app.outputs.present == 'true'
        run: npm run gates

  # A PR is graded against main as it was when its run started; main then moves. So a
  # red push/nightly/manual run on main's CURRENT head opens ONE issue labelled
  # `main-red` assigned to the repo owner; later red runs comment on it; the first green
  # run on main's head closes it. Runs for an older SHA, and runs whose gate jobs were
  # cancelled or skipped, leave the issue alone. (Ported from the app this kit came from.)
  main-red-alert:
    needs: [python, mobile]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: ci-main-red-alert
      cancel-in-progress: false
    steps:
      - name: Open, update or close the main-red issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          red=$(jq -r '[.[].result] | any(. == "failure")' <<<"$NEEDS")
          green=$(jq -r '[.[].result] | all(. == "success")' <<<"$NEEDS")
          failed=$(jq -r 'to_entries | map(select(.value.result == "failure") | .key) | join(", ")' <<<"$NEEDS")
          if [ "$red" != "true" ] && [ "$green" != "true" ]; then
            echo "Gate jobs were cancelled/skipped, not red or green; leaving main-red alone."; exit 0
          fi
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$head" != "$SHA" ]; then echo "main moved on ($SHA -> $head); that commit's own run decides."; exit 0; fi
          short="${SHA:0:7}"
          open=$(gh issue list --label main-red --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$red" = "true" ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "Still red at \`$short\` ($EVENT run). Failing: $failed. $RUN_URL"; exit 0
            fi
            gh label create main-red --color B60205 --description "CI is failing on main" --force
            printf '%s\n' "@$OWNER CI is **red on \`main\`** at \`$short\` ($EVENT run)." "" \
              "Failing job(s): **$failed**" "" "Run: $RUN_URL" "" \
              "Every branch cut from main inherits this until it is fixed. Reproduce: \`scripts/dev-venv.sh python -m pytest -q\` and \`cd mobile && npm run gates\`." "" \
              "Managed by the \`main-red-alert\` job in \`.github/workflows/ci.yml\`: later red runs comment here; the first green run on main's head closes it." \
              > "$RUNNER_TEMP/main-red.md"
            # Assign the owner only when the repo belongs to a user: on an org-owned repo the
            # org name is not assignable and the alert job itself would go red.
            assign=(); [ "$(gh api "users/$OWNER" --jq .type 2>/dev/null)" = "User" ] && assign=(--assignee "$OWNER")
            gh issue create --title "main is red: $failed" --label main-red "${assign[@]}" --body-file "$RUNNER_TEMP/main-red.md"
          elif [ -n "$open" ]; then
            gh issue comment "$open" --body "Green again at \`$short\` ($EVENT run): $RUN_URL. Closing."
            gh issue close "$open" --reason completed
          else
            echo "main is green and no main-red issue is open."
          fi
