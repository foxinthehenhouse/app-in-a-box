# CI: the merge gate. Required checks for branch protection: `python`, `mobile`.
#   python: ruff + pyright + pytest with a coverage floor. pytest collects tests/ AND
#           tests/harness/ (skills, agents, rules, memory, hooks, AGENTS.md, workflows,
#           JSON/TOML configs), so the agent harness is linted on every PR too.
#   mobile: `npm run gates` (tsc + eslint + guard scripts + jest).
# Sibling workflows: workflow-lint.yml, security.yml, db.yml.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check backend tests scripts
      - name: Pyright (basic mode, config in pyproject.toml)
        run: pyright
      - name: Pytest (backend + harness lint) with coverage floor
        run: python -m pytest -q --cov --cov-report=term-missing

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip until the mobile app is scaffolded
        id: app
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::mobile/package.json not found (scaffold phase not run yet); skipping gates"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        if: steps.app.outputs.present == 'true'
        run: npm ci
      - name: Gates (tsc + eslint + guard scripts + jest)
        if: steps.app.outputs.present == 'true'
        run: npm run gates
