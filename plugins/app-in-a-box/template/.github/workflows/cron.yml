# Scheduled backend jobs (see docs/runbooks/release.md). Needs repo secret CRON_SECRET
# and variable API_URL; until CRON_SECRET is set every call gets a 503 naming the
# missing feature, so this workflow fails loudly rather than silently doing nothing.
name: cron
on:
  schedule:
    - cron: "7 8 * * 1"      # weekly-digest, Mondays 08:07 UTC
    - cron: "*/30 * * * *"   # push-receipts
    - cron: "17 3 * * *"     # prune-rate-limits
  workflow_dispatch:
    inputs:
      job: { description: "job name", required: true }
permissions: {}
jobs:
  call:
    # Off until provisioning sets the API_URL variable (and the CRON_SECRET secret),
    # so a fresh repo doesn't fail a scheduled run every 30 minutes.
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the job
        env:
          API_URL: ${{ vars.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ github.event.inputs.job }}
        run: |
          case "$SCHEDULE" in
            "7 8 * * 1") JOB=weekly-digest ;;
            "*/30 * * * *") JOB=push-receipts ;;
            "17 3 * * *") JOB=prune-rate-limits ;;
            *) JOB="$INPUT_JOB" ;;
          esac
          case "$JOB" in
            weekly-digest|push-receipts|prune-rate-limits) ;;
            *) echo "unknown job: $JOB" >&2; exit 1 ;;
          esac
          [ -n "$CRON_SECRET" ] || { echo "CRON_SECRET secret is not set" >&2; exit 1; }
          curl -fsS --retry 3 --retry-all-errors -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" "$API_URL/internal/cron/$JOB"
