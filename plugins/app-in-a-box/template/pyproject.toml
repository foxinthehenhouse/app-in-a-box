[project]
# Not a distributable package (nothing installs it; Railway runs uvicorn from the tree),
# but `requires-python` is where tooling and humans look for the floor. 3.12 is not a
# preference: backend/services/push_service.py uses PEP 695 generics (`def chunks[T]`),
# which is a SyntaxError on 3.11. scripts/dev-venv.sh and CI both build 3.12 venvs.
name = "__APP_SLUG__"
version = "0.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Every guard under tests/ (including tests/harness/) is wired by THIS line and nothing
# else. tests/harness/test_guards_wired.py fails if it is narrowed or if addopts starts
# deselecting by path or name.
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short -m 'not integration'"
markers = [
    "integration: needs a real Postgres with supabase/migrations applied; excluded by default",
]

[tool.coverage.run]
# Scoped to the code we own. CI runs `pytest --cov` and fails under the floor below.
source = ["backend"]
branch = true

[tool.coverage.report]
# A floor, not a target: it stops a PR landing a module with no tests at all. Raise
# it as the app grows; never lower it to get a PR green.
fail_under = 85
show_missing = true
skip_covered = true

[tool.pyright]
# Basic mode: catches wrong attribute/argument types and missing imports without
# demanding annotations on every test fake. CI runs `pyright` from the dev venv.
include = ["backend", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingModuleSource = false
# Diagnostics suppressed per file, each with a reason. Shrink, don't grow.
#   backend/observability.py: sentry-sdk types `before_send` with its Event TypedDict;
#   scrub_event takes a plain dict. Correct at runtime; fix with typing.cast, then drop.
ignore = ["backend/observability.py"]

[tool.importlinter]
# Architecture boundaries as checks, not prose (AGENTS.md rules 1 and 8, backend/AGENTS.md
# "Layout"). CI runs `lint-imports`; locally, `scripts/dev-venv.sh lint-imports`. A broken
# contract names the import and the line. Fix the code, don't loosen the contract: moving
# a boundary is an architecture decision, so it goes in docs/decision-log.md.
root_package = "backend"
# Third-party packages are in the graph too, so the forbidden contract below can name an SDK.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Routers do I/O, services hold logic, db.py and config.py sit underneath"
type = "layers"
containers = ["backend"]
# Higher layers may import lower ones, never the reverse (indirect chains count too).
# Modules not listed (auth, ratelimit, middleware, observability) are shared helpers.
layers = ["main", "routers", "services", "db", "config"]
broken_contract_guidance = "A lower layer reached up. Services take what they need as arguments (a db client, a user id) and return data; the router turns it into HTTP. Move the shared piece down, or pass it in."

[[tool.importlinter.contracts]]
name = "LLM SDKs are fenced in the AI module (AGENTS.md rule 8)"
type = "forbidden"
source_modules = ["backend"]
forbidden_modules = ["anthropic", "openai"]
# Nothing calls a model yet, so nothing is allowed to. The recipe-ai-feature skill adds
# the one fenced module here, e.g. "backend.services.ai_summary -> anthropic". An entry
# that matches no import fails the check, so a stale fence can't linger.
ignore_imports = []
broken_contract_guidance = "Model calls live in one module, backend/services/ai_<feature>.py, listed in this contract's ignore_imports and in AGENTS.md rule 8. Call that module instead of the SDK."

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned so a ruff upgrade can't change what CI enforces underneath you.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection defaults are intentional, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header"]
