# Smoke: the app launches to sign-in and the email field takes input. Runs on ANY
# build, including a release-mode EAS build where demo mode is off (tag: smoke).
appId: __BUNDLE_ID__
tags:
  - smoke
---
- runFlow: common/launch.yaml
- assertVisible:
    id: "signin-screen"
- tapOn:
    id: "signin-email-input"
- inputText: "smoke@example.com"
- assertVisible:
    id: "signin-send-button"
- takeScreenshot: smoke-signin
