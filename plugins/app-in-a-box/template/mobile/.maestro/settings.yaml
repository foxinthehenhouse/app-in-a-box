# Settings: rows and switches respond, and sign-out returns to sign-in.
appId: __BUNDLE_ID__
tags:
  - demo
---
- runFlow: common/signin-demo.yaml
- tapOn:
    id: "tab-settings"
- assertVisible:
    id: "settings-screen"
- assertVisible:
    id: "settings-appearance"
- tapOn:
    id: "settings-analytics-switch"
- scrollUntilVisible:
    element:
      id: "settings-signout-button"
- tapOn:
    id: "settings-signout-button"
- extendedWaitUntil:
    visible:
      id: "signin-screen"
    timeout: 10000
