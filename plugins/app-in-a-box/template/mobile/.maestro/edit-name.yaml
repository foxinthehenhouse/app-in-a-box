# Edit name: the sheet opens from Settings, saves, and the new name reaches Home.
appId: __BUNDLE_ID__
tags:
  - demo
---
- runFlow: common/signin-demo.yaml
- tapOn:
    id: "tab-settings"
- tapOn:
    id: "settings-name-row"
- assertVisible:
    id: "edit-name-sheet"
- tapOn:
    id: "edit-name-input"
- eraseText
- inputText: "Riley"
- tapOn:
    id: "edit-name-save-button"
- assertNotVisible:
    id: "edit-name-sheet"
- tapOn:
    id: "tab-home"
- assertVisible:
    text: ".*Riley.*"
