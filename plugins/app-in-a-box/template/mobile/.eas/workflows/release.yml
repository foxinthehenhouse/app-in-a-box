# Release: every push to `release` (fast-forward it from main when you ship; see
# docs/runbooks/release.md). Checked against the EAS Workflows docs source (expo/expo
# docs/pages/eas/workflows/pre-packaged-jobs.mdx, 2026-10); tests/test_eas_workflows.py
# pins the rules below.
#
# Per platform, all in the `production` EAS environment:
#   native changed   -> production build -> EAS Submit (TestFlight / Play internal).
#                       Store review and phased release stay human steps.
#   native unchanged -> OTA update to the `production` branch.
#                       Roll back with scripts/rollback-ota.sh (docs/runbooks/rollback.md).
#
# Submit needs, once per store (provision step 5, owner):
#   iOS      the app exists in App Store Connect; `eas credentials -p ios` -> App Store
#            Connect API Key; eas.json submit.production.ios.ascAppId = its Apple ID.
#            Without ascAppId a non-interactive submit fails.
#   Android  the first upload is manual (Play requires it); then a Google service
#            account key via `eas credentials -p android`.
# The production channel points at the `production` branch (EAS creates both on the
# first production build).

name: Release

on:
  push:
    branches: ["release"]

jobs:
  fingerprint:
    name: Fingerprint native layer
    type: fingerprint
    environment: production

  get_android_build:
    name: Find Android production build with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  get_ios_build:
    name: Find iOS production build with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  build_android:
    name: Native changed - build Android (production)
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Native changed - build iOS (production)
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit to Play internal testing
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  update_android:
    name: Native unchanged - Android OTA to production
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    environment: production
    params:
      platform: android
      branch: production
      message: "Release ${{ github.sha }}"

  update_ios:
    name: Native unchanged - iOS OTA to production
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: production
    params:
      platform: ios
      branch: production
      message: "Release ${{ github.sha }}"
