# UNVERIFIED SCHEMA: written against the EAS Workflows syntax as of mid-2026, but
# docs.expo.dev was unreachable when this file was generated. Before relying on it,
# check it against https://docs.expo.dev/eas/workflows/syntax/ (job types
# `fingerprint`, `get-build`, `build`, `submit`, `update`, and their params/outputs)
# and run it once by hand: `npx eas-cli workflow:run .eas/workflows/release.yml`.
#
# Release: every push to `release` (fast-forward it from main when you ship; see
# docs/runbooks/release.md). Same fingerprint logic as PR previews, for production:
#
#   native changed   -> production build -> EAS Submit (TestFlight / Play internal)
#                       Store review + phased release stay human steps.
#   native unchanged -> OTA update straight to the `production` channel's branch.
#                       Roll back with docs/runbooks/rollback.md.
#
# Needs: `eas credentials` set up for both stores, a `production` submit profile
# (eas.json `submit.production`: ascAppId for iOS, a Play service-account key
# uploaded with `eas credentials` for Android), and the production channel mapped to
# the `production` branch (`eas channel:edit production --branch production`).

name: Release

on:
  push:
    branches: ["release"]

jobs:
  fingerprint:
    name: Fingerprint native layer
    type: fingerprint

  get_android_build:
    name: Find Android production build with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: production

  get_ios_build:
    name: Find iOS production build with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production

  build_android:
    name: Build Android (production)
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS (production)
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit to Play internal testing
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  publish_update:
    name: Native unchanged - OTA to production
    needs: [get_android_build, get_ios_build]
    if: ${{ needs.get_android_build.outputs.build_id && needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      branch: production
      message: "Release ${{ github.sha }}"
