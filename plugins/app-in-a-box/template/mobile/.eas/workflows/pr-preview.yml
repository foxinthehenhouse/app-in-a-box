# PR previews. Checked against the EAS Workflows docs source (expo/expo
# docs/pages/eas/workflows/{syntax,pre-packaged-jobs}.mdx, 2026-10): job types
# fingerprint / get-build / build / update, their params and outputs, `if:`, and
# github.event.pull_request.number. tests/test_eas_workflows.py pins the rules below.
#
# Per platform:
#   a preview build with this native fingerprint exists -> publish the JS as an OTA
#     update to branch pr-<n>; testers open it from that existing preview build
#   none exists (native changed) -> build a new preview binary
# Platforms are independent: an iOS-only native change still OTAs Android.
#
# Previews go to 100% of the pr-<n> branch at once (testers want them now), and never
# take a staged rollout: one in progress would block the PR's next push. Each update
# uploads its source maps to Sentry (SENTRY_* in the `preview` EAS environment, provision step 3).
#
# Every job runs in the `preview` EAS environment. fingerprint and update default to
# `production`, which would hash and publish with production env vars and never
# match a preview build.
#
# Needs: `eas init` (provision step 5), the `preview` profile + channel in eas.json,
# expo-updates, and the expo.dev GitHub app connected to this repo with base
# directory `mobile`. No EXPO_TOKEN: EAS Workflows authenticate through that app.

name: PR preview

on:
  pull_request:
    branches: ["main"]

jobs:
  fingerprint:
    name: Fingerprint native layer
    type: fingerprint
    environment: preview

  get_android_build:
    name: Find Android preview build with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  get_ios_build:
    name: Find iOS preview build with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  build_android:
    name: Native changed - build Android preview
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview

  build_ios:
    name: Native changed - build iOS preview
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: preview

  update_android:
    name: Native unchanged - Android OTA to pr-<n>
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    environment: preview
    params:
      platform: android
      branch: pr-${{ github.event.pull_request.number }}
      message: "PR #${{ github.event.pull_request.number }}"
      upload_sentry_sourcemaps: true

  update_ios:
    name: Native unchanged - iOS OTA to pr-<n>
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: preview
    params:
      platform: ios
      branch: pr-${{ github.event.pull_request.number }}
      message: "PR #${{ github.event.pull_request.number }}"
      upload_sentry_sourcemaps: true
