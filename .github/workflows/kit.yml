# App in a Box kit CI. The kit's product is the repo it generates, so the gate is:
# render the template, then prove the generated repo's own guards pass AND fail on
# planted violations (scripts/selftest.sh + scripts/selftest.d/*.sh).
#   selftest   every PR/push: renderer, design, backend, git/agent hooks, and the
#              v0.3 trust checks (harness lint, wire contract, scoping, migrations,
#              actionlint, zizmor, and the full Postgres + pgTAP DB gate)
#   plugin     `claude plugin validate --strict` on the marketplace, the plugin and
#              a RENDERED repo's .agents/ (the raw template still holds __APP_SLUG__
#              placeholders, which aren't valid names; no auth needed; fails if the
#              CLI can't start)
#   (selftest runs with APPBOX_SELFTEST_STRICT=1: a check that can't run fails)
#   workflows  actionlint on this repo's workflows and the template's
#   mobile     nightly: a real create-expo-app + `npm run gates` + mobile guard plants
# Skill evals live in evals.yml (manual dispatch with your own ANTHROPIC_API_KEY; skips without one).
name: Kit
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      mobile:
        description: Also run the --mobile selftest (real Expo app, ~5 min)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # PR runs share a per-PR group (a newer push cancels the stale run). Every other run
  # (push to main, schedule, manual) gets its OWN group: under a shared `github.ref`
  # key GitHub keeps one PENDING run per group and silently cancels older ones, so a
  # burst of merges left main's middle commits unchecked in the app this kit came from.
  group: kit-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  CLAUDE_CODE_VERSION: "2.1.285"
  # Same pin as the template's security.yml, so the selftest exercises what founders run.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # `maestro check-syntax` on the generated flows (no device needed; Java is on the runner).
  MAESTRO_VERSION: "2.11.0"
  MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APPBOX_SELFTEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Every check must run here: a missing tool fails the job instead of skipping.
      APPBOX_SELFTEST_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Tools the trust checks exercise (actionlint, zizmor, gitleaks, maestro)
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/share" "$HOME/.local/bin"
          unzip -q maestro.zip -d "$HOME/.local/share"
          rm maestro.zip
          ln -sf "$HOME/.local/share/maestro/bin/maestro" "$HOME/.local/bin/maestro"
          "$HOME/.local/bin/maestro" --version
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf gitleaks.tgz -C "$HOME/.local/bin" gitleaks
          curl -fsSL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf actionlint.tgz -C "$HOME/.local/bin" actionlint
          python -m pip install "zizmor==1.30.1" "pyyaml==6.0.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Throwaway Postgres with pgTAP (the generated repo's DB gate runs against it)
        run: |
          PGV="$(find /usr/lib/postgresql -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -n | tail -1)"
          sudo apt-get update -q
          sudo apt-get install -y -q "postgresql-${PGV}-pgtap"
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -c "alter user postgres password 'postgres'"
      - name: Selftest
        run: scripts/selftest.sh

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: claude plugin validate --strict
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" >/dev/null
          # A validator that can't start must fail the job, not pass it with a warning.
          if ! claude --version; then
            echo "::error::the claude CLI could not start, so the plugins were NOT validated"
            exit 1
          fi
          claude plugin validate --strict .
          claude plugin validate --strict plugins/app-in-a-box
          # Validate the .agents/ plugin a founder actually gets: render first, so the
          # __APP_SLUG__ placeholders are filled in, exactly as new-app does.
          app="$RUNNER_TEMP/rendered"
          python3 plugins/app-in-a-box/scripts/render.py --target "$app" --name "Penny Jar" \
            --slug penny-jar --bundle-id com.example.pennyjar --owner example >/dev/null
          claude plugin validate --strict "$app/.agents"

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (this repo + the template's workflows)
        run: |
          curl -fsSL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color .github/workflows/*.yml plugins/app-in-a-box/template/.github/workflows/*.yml

  mobile:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: PyYAML (the selftest reads the generated workflows)
        run: python -m pip install "pyyaml==6.0.2"
      - name: Selftest with a real Expo app
        run: scripts/selftest.sh --mobile
