version: 1
kit_root: <your clone>/plugins/app-in-a-box
app:
  name: "Lonely Socks"
  slug: lonely-socks
  bundle_id: com.example.lonelysocks
  one_liner: "Sock owners use Lonely Socks to reunite lost pairs"
  platforms: [ios, android]
  owner_handle: foxinthehenhouse
product:
  target_user: "Anyone with a drawer full of single socks"
  problem: "I have 11 single socks and no idea which ones have a partner somewhere"
  core_loop:
    trigger: "You find a single sock in the laundry"
    action: "Log it in 5 seconds (colour + pattern)"
    feedback: "The app tells you if a matching lonely sock is already logged; tap Reunite"
    return_reason: "Reunion count and a weekly 'drawer amnesty' nudge"
  north_star: "Socks reunited per active user per week"
  retention_mechanic: streaks
  monetisation: free
  sensitive_data: []
  ai:
    enabled: false
    allowed_modules: []
stack:
  mobile: expo
  backend: fastapi
  hosting: railway
  auth: [email_otp]
  tracker: github
  analytics: posthog
  errors: sentry
design:
  direction: playful
resources: {}
progress:
  preflight: done
  interview: done
  design: done
